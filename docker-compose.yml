services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - AWS_BEARER_TOKEN_BEDROCK
      - TYPESAFE_API_KEY
      - OPENAI_API_KEY
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - BEDROCK_MODEL_ID=${BEDROCK_MODEL_ID:-us.anthropic.claude-3-5-sonnet-20241022-v2:0}
      - SYNTH_SAMPLE=${SYNTH_SAMPLE:-8}

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
