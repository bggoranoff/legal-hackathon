[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adversarial-traces"
version = "0.1.0"
description = "Feedback-guided text anonymization and coherent synthetic agent traces"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.68.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
adversarial_traces = ["py.typed"]
